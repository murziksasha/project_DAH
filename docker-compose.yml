services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dah_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-dah}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dah}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional legacy queue (worker uses inline cron by default). Start with: --profile redis
  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dah_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dah_minio_secret_change_me}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-dah_minio} $${S3_SECRET_KEY:-dah_minio_secret_change_me};
      mc mb --ignore-existing local/$${S3_BUCKET:-dah-files};
      exit 0;
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dah_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dah_minio_secret_change_me}
      S3_BUCKET: ${S3_BUCKET:-dah-files}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dah}:${POSTGRES_PASSWORD:-dah_secret_change_me}@postgres:5432/${POSTGRES_DB:-dah}
      # Redis optional (health skips when empty / none)
      REDIS_URL: ${REDIS_URL:-none}
      S3_ENDPOINT: http://minio:9000
      BACKUP_DIR: /backups
      BACKUP_STATUS_PATH: /backups/last-backup.json
      # Weekly dumps are fine for health "stale" threshold (default was 48h)
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-192}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3001:3001"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dah}:${POSTGRES_PASSWORD:-dah_secret_change_me}@postgres:5432/${POSTGRES_DB:-dah}
      REDIS_URL: ${REDIS_URL:-none}
      S3_ENDPOINT: http://minio:9000
      BACKUP_DIR: /backups
      BACKUP_STATUS_PATH: /backups/last-backup.json
    volumes:
      - ./backups:/backups
    depends_on:
      api:
        condition: service_started

  # Static Next export served by nginx:alpine (no Node process)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

  backup:
    profiles: ["backup"]
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-dah_secret_change_me}
      POSTGRES_USER: ${POSTGRES_USER:-dah}
      POSTGRES_DB: ${POSTGRES_DB:-dah}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "TS=$$(date +%Y%m%d_%H%M%S) && mkdir -p /backups/$$TS &&
      pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB | gzip > /backups/$$TS/database.sql.gz &&
      echo Backup saved to /backups/$$TS"

volumes:
  postgres_data:
  minio_data:
