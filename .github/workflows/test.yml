name: Test

on:
  push:
    branches: [main, master, experemntalBranch]
  pull_request:

jobs:
  api-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @dah/shared
      - run: npm run build -w @dah/money
      - run: npm run db:generate -w @dah/api
      - run: npm run test:cov -w @dah/api

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -w @dah/api
        continue-on-error: true
      - run: npm run lint -w @dah/web
        continue-on-error: true
