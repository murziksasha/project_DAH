# ==============================================================================
# «Мій дім» — Self-Hosted Docker Compose for KeenDNS (~50 users)
# ==============================================================================
# Usage:
#   1. cp .env.selfhost.example .env.selfhost
#   2. Edit .env.selfhost (set your KeenDNS domain, e.g. DOMAIN=my-house.keenetic.link)
#   3. docker compose --env-file .env.selfhost -f docker-compose.selfhost.yml up -d --build
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set strong POSTGRES_PASSWORD in .env.selfhost}
      POSTGRES_DB: ${POSTGRES_DB:-dah}
    volumes:
      - dah_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dah}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  minio:
    # M16: pin in production, e.g. MINIO_IMAGE=minio/minio:RELEASE.<date> (see docs/UPGRADE-phase2.md)
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dah_minio_user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set strong S3_SECRET_KEY in .env.selfhost}
    volumes:
      - dah_minio_data:/data
    healthcheck:
      # M16: `mc ready` works in current MinIO images (curl was removed from them); curl kept as fallback.
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1 || curl -fsS http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 256m

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-dah_minio_user} $${S3_SECRET_KEY};
      mc mb --ignore-existing local/$${S3_BUCKET:-dah-files};
      exit 0;
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dah_minio_user}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-dah-files}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    user: "node"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dah}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dah}
      JWT_SECRET: ${JWT_SECRET:?Set strong JWT_SECRET in .env.selfhost}
      FILE_DOWNLOAD_SECRET: ${FILE_DOWNLOAD_SECRET:?Set strong FILE_DOWNLOAD_SECRET in .env.selfhost}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dah_minio_user}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-dah-files}
      CORS_ORIGIN: ${APP_URL}
      APP_URL: ${APP_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      KEP_ALLOW_MOCK: ${KEP_ALLOW_MOCK:-false}
      TRUST_PROXY: "1"
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      REDIS_URL: none
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      BACKUP_DIR: /backups
      BACKUP_STATUS_PATH: /backups/last-backup.json
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-192}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 512m

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    user: "node"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dah}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dah}
      JWT_SECRET: ${JWT_SECRET}
      FILE_DOWNLOAD_SECRET: ${FILE_DOWNLOAD_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dah_minio_user}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-dah-files}
      CORS_ORIGIN: ${APP_URL}
      APP_URL: ${APP_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      KEP_ALLOW_MOCK: ${KEP_ALLOW_MOCK:-false}
      REDIS_URL: none
      BACKUP_DIR: /backups
      BACKUP_STATUS_PATH: /backups/last-backup.json
    volumes:
      - ./backups:/backups
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api
    mem_limit: 128m

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx-selfhost.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    mem_limit: 64m

volumes:
  dah_postgres_data:
    name: dah_selfhost_postgres_data
  dah_minio_data:
    name: dah_selfhost_minio_data
