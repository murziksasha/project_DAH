# Production overlay: HTTPS via nginx + stricter env
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  api:
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost}
      REDIS_URL: ${REDIS_URL:-none}
    restart: always
    # Do not publish MinIO/Postgres/Redis ports in prod — only via this overlay on host firewall

  worker:
    environment:
      REDIS_URL: ${REDIS_URL:-none}
    restart: always

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost/api}
    restart: always

  nginx:
    volumes:
      - ./infra/nginx/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - ${SSL_CERT_DIR:-./infra/certs}:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    restart: always

  postgres:
    restart: always
    # Prefer not publishing 5432 publicly in real prod (override ports: [] if needed)

  minio:
    restart: always
    # Prefer not publishing 9000/9001 publicly — files stream via API /api/files/download
