server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser uses same-origin /api — must reach Nest (not static files).
    # Docker Compose service name: api. Direct :3000 access then works without edge nginx.
    location /api/ {
        client_max_body_size 25m;
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location /api/backups/ {
        client_max_body_size 512m;
        proxy_pass http://api:3001/api/backups/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # App Router static export (trailingSlash: true) → /admin/index.html etc.
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Long-cache hashed assets; HTML short-cache
    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
