server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # App Router static export (trailingSlash: true) → /admin/index.html etc.
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Long-cache hashed assets; HTML short-cache
    location /_next/static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
